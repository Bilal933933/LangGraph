name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langgraph-lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check app tests migrations
      - run: uv run mypy app
      - run: uv run pytest -q
      - run: uv run alembic -c alembic.ini upgrade head --sql > /dev/null
        env:
          DATABASE_URL: sqlite:////tmp/ci-alembic-check.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langgraph-lab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: langgraph-lab/web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
