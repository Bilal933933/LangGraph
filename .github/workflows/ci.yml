name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: langgraph-lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check app tests migrations
      - run: uv run mypy app
      - run: uv run pytest -q
      - run: uv run alembic -c alembic.ini upgrade head --sql > /dev/null
        env:
          DATABASE_URL: sqlite:////tmp/ci-alembic-check.db
      - run: uv run alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/langgraph_lab

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langgraph-lab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: langgraph-lab/web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx eslint .
      - run: npx tsc --noEmit
