[project]
name = "langgraph-lab"
version = "0.1.0"
description = "LangGraph learning lab - Phase 1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "fastmcp>=4.0.10",
    # تجميد 2.0.x: Smart App Control يمنع DLLs سلسلة 2.1 على أجهزة ويندوز للتطوير
    "sqlalchemy>=2.0.0,<2.1",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.21.0",
    "numpy>=1.26.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = ["live: تقييمات بالنموذج الحقيقي (RUN_LIVE_EVALS=1 فقط)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
